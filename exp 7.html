<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation Menu</title>

    <style>
        ul {
            list-style-type: none;
            background-color: #333;
            overflow: hidden;
            padding: 0; 
            margin: 0;
        }

        li {
            float: left;
        }

        li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
        }
    </style>
</head>
<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

</body>
</html>
