<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 17: Form Attributes and Input Validation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h2 { color: #1a1a7a; }
        .output { border: 1px solid #aaa; padding: 20px; width: 400px; }
        .field { margin-bottom: 15px; }
        input { padding: 4px; width: 220px; }
        button { padding: 6px 12px; }
    </style>
</head>
<body> 

    <h2>Assignment 17: Form Attributes and Input Validation</h2>
    <p><b>Aim:</b> To apply method, action, required, pattern, min, max and length validation.</p>

    <div class="output">
        <form method="POST" action="submit.php">

           
            <div class="field">
                <input type="text" name="fullname" placeholder="Full name" required>
            </div>

            
            <div class="field">
                <input type="email" name="email" placeholder="you@college.edu" required>
            </div>

           
            <div class="field">
                <input type="tel" name="mobile" placeholder="10-digit mobile"
                       pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
            </div>

           
            <div class="field">
                <input type="password" name="password" placeholder="Min 6 characters"
                       minlength="6" required>
            </div>
 
           
            <div class="field">
                <input type="number" name="age" placeholder="Age (17-30)"
                       min="17" max="30" required>
            </div>

            <div class="field">
                <button type="submit">Register</button>
            </div>

        </form>
    </div>

</body>
</html>
